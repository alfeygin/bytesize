  html, body { height: 100%; }

    color: var(--text);

  .brand span { font-family: var(--sand); font-weight: 700; font-size: 19px; }

  h1 {
    font-family: var(--sand); font-weight: 700;
    font-size: clamp(26px, 6vw, 38px);
    letter-spacing: -0.01em; line-height: 1.14;
    margin: 26px 0 0;
  }
  h1 em { font-style: normal; color: var(--accent); }

  /* ── Coffee maker ─────────────────────────────────────── */
  .brewer { width: min(258px, 66vw); height: auto; margin: 0 auto; display: block; }

  .water-fill  { transform-box: fill-box; transform-origin: bottom;
                 animation: tank 9s ease-in-out infinite; }
  .coffee-fill { transform-box: fill-box; transform-origin: bottom;
                 animation: carafe 9s ease-in-out infinite; }

  @keyframes tank {
    0%   { transform: scaleY(1); }
    70%  { transform: scaleY(.05); }
    84%  { transform: scaleY(.05); }
    96%  { transform: scaleY(1); }
    100% { transform: scaleY(1); }
  }
  @keyframes carafe {
    0%   { transform: scaleY(.03); }
    70%  { transform: scaleY(1); }
    88%  { transform: scaleY(1); }
    97%  { transform: scaleY(.03); }
    100% { transform: scaleY(.03); }
  }

  /* Drips fall on their own short loop, staggered so the stream never stalls. */
  .drip {
    transform-box: fill-box; transform-origin: center;
    animation: drip 1.15s linear infinite; opacity: 0;
  }
  .drip.d2 { animation-delay: .38s; }
  .drip.d3 { animation-delay: .76s; }
  .drip.c2 { animation-delay: .52s; }

  @keyframes drip {
    0%   { transform: translateY(0)    scaleY(.7); opacity: 0; }
    14%  { opacity: 1; }
    82%  { opacity: 1; }
    100% { transform: translateY(24px) scaleY(1.3); opacity: 0; }
  }

  .steam {
    transform-box: fill-box; transform-origin: bottom center;
    animation: steam 4.2s ease-out infinite; opacity: 0;
  }
  .steam.s2 { animation-delay: 1.4s; }
  .steam.s3 { animation-delay: 2.8s; }
  @keyframes steam {
    0%   { transform: translateY(4px) scaleX(.8); opacity: 0; }
    25%  { opacity: .55; }
    100% { transform: translateY(-26px) scaleX(1.25); opacity: 0; }
  }

  .lamp { animation: lamp 2.6s ease-in-out infinite; }
  @keyframes lamp { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* Hold a readable mid-brew pose for anyone who does not want motion. */
  @media (prefers-reduced-motion: reduce) {
    .water-fill, .coffee-fill, .drip, .steam, .lamp { animation: none; }
    .water-fill  { transform: scaleY(.55); }
    .coffee-fill { transform: scaleY(.45); }
    .drip  { opacity: 1; }
    .steam { opacity: .4; }
  }
</style>
</head>
<body>
<main>

  <div class="brand">
    <span class="mark" role="img" aria-label="ByteSize"></span>
    <span>ByteSize</span>
  </div>

  <!-- Moccamaster-inspired brewer: tower on the right, arm across the top,
       cone filter over the carafe. Decorative, so hidden from assistive tech. -->
  <svg class="brewer" viewBox="0 0 240 320" role="img" aria-label="A coffee maker brewing" focusable="false">
    <defs>
      <clipPath id="tankClip"><rect x="182" y="36" width="34" height="112" rx="6"/></clipPath>
      <clipPath id="carafeClip">
        <path d="M80 184h68l-5 62a10 10 0 0 1-10 10H95a10 10 0 0 1-10-10z"/>
      </clipPath>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4C8E74"/>
        <stop offset="1" stop-color="#2C5C49"/>
      </linearGradient>
    </defs>

    <!-- base slab + warming plate -->
    <rect x="36" y="266" width="192" height="18" rx="8" fill="var(--accent-deep)"/>
    <rect x="58" y="256" width="112" height="11" rx="4" fill="#3A6B57"/>

    <!-- tower + top arm -->
    <rect x="74"  y="14" width="152" height="36"  rx="14" fill="url(#bodyGrad)"/>
    <rect x="164" y="14" width="62"  height="252" rx="14" fill="url(#bodyGrad)"/>

    <!-- copper heating element, the detail that says Moccamaster -->
    <rect x="171" y="160" width="11" height="92" rx="5.5" fill="#B4703C"/>
    <rect x="171" y="160" width="11" height="92" rx="5.5" fill="none"
          stroke="#8E5528" stroke-width="1.5"/>

    <!-- water window -->
    <rect x="182" y="36" width="34" height="112" rx="6" fill="var(--glass)"/>
    <g clip-path="url(#tankClip)">
      <rect class="water-fill" x="182" y="36" width="34" height="112" fill="var(--water)"/>
    </g>
    <rect x="182" y="36" width="34" height="112" rx="6" fill="none"
          stroke="var(--accent-deep)" stroke-width="2.5"/>
    <line x1="187" y1="64"  x2="198" y2="64"  stroke="var(--accent-deep)" stroke-width="2" opacity=".3"/>
    <line x1="187" y1="92"  x2="198" y2="92"  stroke="var(--accent-deep)" stroke-width="2" opacity=".3"/>
    <line x1="187" y1="120" x2="198" y2="120" stroke="var(--accent-deep)" stroke-width="2" opacity=".3"/>

    <!-- switch + indicator lamp -->
    <rect x="187" y="196" width="24" height="12" rx="4" fill="var(--accent-deep)"/>
    <circle class="lamp" cx="199" cy="224" r="5" fill="var(--glow)"/>

    <!-- spout under the arm -->
    <rect x="96" y="48" width="28" height="16" rx="5" fill="var(--accent-deep)"/>
    <rect x="106" y="62" width="8" height="7" rx="2" fill="var(--accent-deep)"/>

    <!-- water drips: spout to filter -->
    <g fill="var(--water)">
      <ellipse class="drip"    cx="110" cy="76" rx="3.2" ry="4.2"/>
      <ellipse class="drip d2" cx="110" cy="76" rx="3.2" ry="4.2"/>
      <ellipse class="drip d3" cx="110" cy="76" rx="3.2" ry="4.2"/>
    </g>

    <!-- cone filter -->
    <rect x="76" y="98" width="68" height="12" rx="5" fill="var(--steel)"/>
    <path d="M82 110h56l-14 38H96z" fill="#E2DCC7"/>
    <path d="M82 110h56l-14 38H96z" fill="none" stroke="var(--accent-deep)"
          stroke-width="2.5" stroke-linejoin="round"/>

    <!-- coffee drips: filter to carafe -->
    <g fill="var(--coffee-light)">
      <ellipse class="drip"    cx="110" cy="154" rx="2.8" ry="3.8"/>
      <ellipse class="drip c2" cx="110" cy="154" rx="2.8" ry="3.8"/>
    </g>

    <!-- steam escaping around the carafe collar -->
    <g stroke="var(--text-faint)" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path class="steam"    d="M88 170c-4-6 4-9 0-15"/>
      <path class="steam s2" d="M136 170c-4-6 4-9 0-15"/>
      <path class="steam s3" d="M92 166c-4-6 4-9 0-15"/>
    </g>

    <!-- carafe: tall and tapered, with a metal collar and a squared handle -->
    <rect x="74" y="170" width="76" height="14" rx="6" fill="var(--steel)"/>
    <path d="M80 184h68l-5 62a10 10 0 0 1-10 10H95a10 10 0 0 1-10-10z" fill="var(--glass)"/>
    <g clip-path="url(#carafeClip)">
      <rect class="coffee-fill" x="80" y="184" width="68" height="72" fill="var(--coffee)"/>
    </g>
    <path d="M80 184h68l-5 62a10 10 0 0 1-10 10H95a10 10 0 0 1-10-10z" fill="none"
          stroke="var(--accent-deep)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M81 198H68a4 4 0 0 0-4 4v28a4 4 0 0 0 4 4h14" fill="none"
          stroke="var(--accent-deep)" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>

  <h1>Something’s brewing!<br><em>Check back soon.</em></h1>


</main>

</body>
</html>
